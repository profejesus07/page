<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Profe Jesús Álvarez</title>
    <script type="text/javascript">
      // Redirige rutas internas (p. ej. /page/examenes) a index.html conservando
      // la ruta, para que GitHub Pages no muestre 404 al recargar o entrar por
      // enlace directo. Basado en https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // "/page"
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
